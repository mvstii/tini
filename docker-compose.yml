services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tini
      POSTGRES_PASSWORD: tini
      POSTGRES_DB: tini
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tini"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://tini:tini@db:5432/tini
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
