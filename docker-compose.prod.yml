# Kapalı test dağıtımı: docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile tunnel up -d --build
# Ayrıntı: docs/DAGITIM.md
services:
  db:
    restart: unless-stopped
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env içinde tanımlı olmalı}

  backend:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://tini:${POSTGRES_PASSWORD}@db:5432/tini
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      retries: 5

  tunnel:
    profiles: ["tunnel"]
    image: ngrok/ngrok:3
    restart: unless-stopped
    command: ["http", "--url=${NGROK_DOMAIN:?NGROK_DOMAIN .env içinde tanımlı olmalı}", "backend:8000"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?NGROK_AUTHTOKEN .env içinde tanımlı olmalı}
    depends_on:
      backend:
        condition: service_healthy
